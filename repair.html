<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>推しマップ キャッシュ修復</title>
<style>
body{margin:0;background:#090b10;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;min-height:100vh;display:grid;place-items:center}
main{width:min(90vw,520px);background:#121722;border:1px solid #293141;border-radius:18px;padding:24px;box-sizing:border-box}
h1{font-size:20px;margin:0 0 12px}.muted{color:#929baa;line-height:1.65;font-size:14px}
</style>
</head>
<body><main><h1>推しマップを最新版へ切り替えています</h1><div id="status" class="muted">旧キャッシュを解除しています…</div></main>
<script>
(async()=>{
  const s=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    s.textContent='修復完了。最新版を開きます…';
  }catch(e){
    s.textContent='キャッシュ解除を続行しました。最新版を開きます…';
  }
  setTimeout(()=>location.replace('./index.html?fresh='+Date.now()),700);
})();
</script></body></html>
