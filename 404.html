<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>撮影会NOW</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="event-row">
      <select id="eventSelect" class="event-select" aria-label="イベント選択"></select>
      <button id="addEvent" class="icon-btn" aria-label="イベントJSON追加">＋</button>
      <button id="manageBtn" class="icon-btn secondary-icon" aria-label="イベント管理">⋯</button>
    </div>
    <div class="title-row">
      <div><div id="eventMeta" class="meta"></div><div id="eventTitle" class="title">撮影会NOW</div></div>
      <div class="clock-wrap"><span id="liveBadge" class="live-badge on">LIVE</span><div id="clock" class="clock">--:--</div></div>
    </div>
    <div class="controls">
      <input id="timeInput" type="time" class="time-input" aria-label="確認時刻">
      <button id="nowBtn" class="small-btn">現在時刻</button>
    </div>
    <div class="api-row"><span id="apiState" class="api-state">無料版・端末内保存</span></div>
  </header>
  <main id="content" class="content"></main>
  <nav class="bottom" aria-label="メインメニュー">
    <button data-tab="now" class="active"><span>◉</span>NOW</button>
    <button data-tab="people"><span>⌕</span>出演者</button>
    <button data-tab="favorites"><span>★</span>お気に入り</button>
    <button data-tab="map"><span>⌖</span>マップ</button>
    <button data-tab="timetable"><span>▦</span>時間表</button>
  </nav>
</div>

<div id="wizard" class="modal" role="dialog" aria-modal="true" aria-label="新しい撮影会を追加">
  <div class="modal-card wizard-card">
    <div class="modal-head"><h2>イベントJSONを追加</h2><button id="closeWizard" class="close">×</button></div>
    <div id="wizardSteps" class="stepper"></div>
    <div id="wizardBody"></div>
  </div>
</div>

<div id="manager" class="modal" role="dialog" aria-modal="true" aria-label="イベント管理">
  <div class="modal-card manager-card">
    <div class="modal-head"><h2>イベント管理</h2><button id="closeManager" class="close">×</button></div>
    <div id="managerBody"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body>
</html>
